[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-pbip-forensics"
version = "1.0.0"
description = "Evidence-based static forensics for Power BI PBIP/PBIR/TMDL projects and Performance Analyzer logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All rights reserved" }
authors = [{ name = "Vinicius de Souza Santos" }]
keywords = ["power-bi", "pbip", "pbir", "tmdl", "dax", "audit", "forensics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pbip-forensics = "pbip_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"tools/**" = ["S603", "S607", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/pbip_forensics"]

[tool.coverage.run]
source = ["pbip_forensics"]
branch = true
# Os entrypoints são executados como scripts empacotados em subprocessos isolados
# (tests/integration/test_skill_scripts.py) e por isso não entram na medição in-process.
omit = ["*/entrypoints/*", "*/__main__.py"]
